[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "falcomplot"
version = "0.1.0"
authors = [
  { name="Example Author", email="author@example.com" },
]
description = "Interactive mapping and visualization tools for FalcomChain"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    # Map rendering
    "folium>=0.15",
    # Geospatial data
    "geopandas>=0.14",
    "shapely>=2.0",
    # Data fetching
    "requests>=2.28",
    "pandas>=2.0",
    "numpy>=1.24",
    # OpenStreetMap
    "osmnx>=1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pip-tools",
]

[project.urls]
"Homepage" = "https://github.com/kirtisoglu/FalcomPlot"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
falcomplot = [
    "web_assets/**/*",
    "mapping/data/*.geojson",
    "mapping/data/*.pkl",
    "mapping/interactive_map.html",
]
