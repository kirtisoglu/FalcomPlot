<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Tree Animation - Blocks + Districts</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body,
        html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        }

        /* BOTTOM-RIGHT CONTROL PANEL */
        #controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 300px;
            max-height: 80vh;
            overflow-y: auto;
            background: transparent;
            border: 1px solid #2196f3;
            padding: 16px;
            border-radius: 6px;
            z-index: 1000;
            font-size: 13px;
            color: #ffffff;
            scrollbar-width: thin;
            scrollbar-color: #2196f3 transparent;
        }

        #controls * {
            color: #ffffff;
        }

        #controls label {
            color: #90caf9 !important;
        }

        #controls h2 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #ffffff !important;
            border-bottom: 1px solid rgba(33, 150, 243, 0.6);
            padding-bottom: 6px;
        }

        #controls button {
            padding: 6px 12px;
            margin: 4px 4px 4px 0;
            background: rgba(33, 150, 243, 0.25);
            color: #ffffff !important;
            border: 1px solid #2196f3;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: background 0.2s;
        }

        #controls button:hover {
            background: rgba(33, 150, 243, 0.55);
        }

        #controls input {
            padding: 4px 8px;
            margin-right: 8px;
            font-size: 13px;
            background: transparent;
            border: 1px solid rgba(33, 150, 243, 0.6);
            border-radius: 4px;
            color: #ffffff;
        }

        #controls input[type="number"] {
            color: #ffffff;
        }

        #controls input[type="range"] {
            accent-color: #2196f3;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: block;
            background: #000;
            z-index: 0;
        }

        #tooltip {
            position: absolute;
            background: rgba(255, 255, 255, 0.98);
            border: 1px solid #aaa;
            padding: 8px 10px;
            font-size: 12px;
            pointer-events: none;
            display: none;
            z-index: 1002;
            border-radius: 6px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
        }

        /* DEBUG PANEL - TOP LEFT, SMALL */
        #debug-panel {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: #0f0;
            padding: 8px;
            font-family: monospace;
            font-size: 10px;
            line-height: 1.3;
            max-width: 400px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 900;
            border-radius: 4px;
            display: none;
        }

        #debug-panel.visible {
            display: block;
        }

        .log-info {
            color: #ccc;
        }

        .log-warn {
            color: #fc0;
        }

        .log-error {
            color: #f33;
            font-weight: bold;
        }

        .log-success {
            color: #6f6;
        }


        #modeIndicator .mode-value {
            font-size: 13px;
            font-weight: bold;
            color: #0d47a1;
        }

        #modeIndicator .coloring-info {
            font-size: 10px;
            color: #424242;
            margin-top: 4px;
        }

        .control-row {
            margin: 8px 0;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .control-row label {
            font-size: 12px;
            color: #555;
            font-weight: 500;
        }

        #iterationDisplay {
            font-size: 16px;
            font-weight: bold;
            color: #2196f3;
            margin: 8px 0;
        }

        #sidebar {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 300px;
            max-height: calc(50vh - 16px);
            background: transparent;
            border: 1px solid #2196f3;
            border-radius: 6px;
            padding: 12px 16px;
            box-sizing: border-box;
            z-index: 500;
            overflow-y: auto;
            color: #ffffff;
            scrollbar-width: thin;
            scrollbar-color: #2196f3 transparent;
        }

        #sidebar::-webkit-scrollbar,
        #controls::-webkit-scrollbar {
            width: 8px;
        }

        #sidebar::-webkit-scrollbar-track,
        #controls::-webkit-scrollbar-track {
            background: transparent;
        }

        #sidebar::-webkit-scrollbar-thumb,
        #controls::-webkit-scrollbar-thumb {
            background: rgba(33, 150, 243, 0.6);
            border-radius: 4px;
            border: 1px solid rgba(33, 150, 243, 0.8);
        }

        #sidebar::-webkit-scrollbar-thumb:hover,
        #controls::-webkit-scrollbar-thumb:hover {
            background: #2196f3;
        }

        /* Also style scrollable status log inside sidebar */
        #statusPanel::-webkit-scrollbar {
            width: 6px;
        }
        #statusPanel::-webkit-scrollbar-track {
            background: transparent;
        }
        #statusPanel::-webkit-scrollbar-thumb {
            background: rgba(33, 150, 243, 0.5);
            border-radius: 3px;
        }

        #sidebar h2,
        #sidebar h3,
        #sidebar div,
        #sidebar span,
        #sidebar b {
            color: #ffffff !important;
        }

        #sidebar h2 {
            margin: 0 0 12px 0;
            font-size: 16px;
            font-weight: 600;
            border-bottom: 1px solid rgba(33, 150, 243, 0.6);
            padding-bottom: 8px;
        }

        #sidebar h3 {
            color: #90caf9 !important;
        }

        .status {
            background: #f0f0f0;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 8px;
            margin-top: 12px;
            font-size: 12px;
            line-height: 1.4;
        }

        .status.error {
            background: #ffebee;
            border-color: #ef5350;
            color: #c62828;
        }

        .status.success {
            background: #e8f5e9;
            border-color: #66bb6a;
            color: #2e7d32;
        }

        /* Step-metadata markup emitted by mountFalcomPlot.js */
        .fp-kv {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            font-size: 12px;
            margin: 2px 0;
        }

        .fp-phase-label {
            font-weight: 600;
            color: #90caf9 !important;
            margin-bottom: 6px;
            white-space: pre-line;
        }

        .fp-section-label {
            font-size: 11px;
            color: #bbdefb !important;
            margin-top: 6px;
        }

        .fp-accept {
            margin-top: 6px;
            font-weight: 700;
            text-align: center;
            border-radius: 4px;
            padding: 3px;
        }

        .fp-accepted {
            background: rgba(102, 187, 106, 0.25);
            color: #a5d6a7 !important;
        }

        .fp-rejected {
            background: rgba(239, 83, 80, 0.25);
            color: #ef9a9a !important;
        }

        .fp-no-data {
            font-size: 12px;
            color: #90a4ae !important;
        }
    </style>
  <script type="module" crossorigin src="./assets/main-BJj3blSO.js"></script>
</head>

<body>
    <div id="controls">
        <div style="margin-bottom: 8px; display: flex; gap: 3px; flex-wrap: wrap;">
            <button id="fp-prevBtn" style="padding:6px 8px;">◀</button>
            <button id="fp-playBtn" style="padding:6px 8px;">▶</button>
            <button id="fp-pauseBtn" style="padding:6px 8px;">⏸</button>
            <button id="fp-stopBtn" style="padding:6px 8px;">⏹</button>
            <button id="fp-finalBtn" style="padding:6px 8px;">⏭</button>
            <button id="fp-nextBtn" style="padding:6px 8px;">▶|</button>
        </div>
        <div style="margin-bottom: 8px;">
            <button id="fp-toggleDetailBtn">Overview</button>
            <button id="fp-toggleColorsBtn">District colors: on</button>
        </div>
        <div>
            <label>Speed:</label>
            <input type="range" id="fp-speedSlider" min="0.5" max="3" step="0.5" value="1" style="width: 100px;">
            <span id="fp-speedLabel">1x</span>
        </div>
        <div style="margin-top: 8px;">
            <label>Iteration:</label>
            <input type="number" id="fp-iterationInput" min="0" value="0" style="width: 60px;">
            <button id="fp-goBtn">Go</button>
        </div>
        <div style="margin-top: 8px;">
            <label>Ensemble:</label>
            <select id="fp-ensembleSelect"
                style="background: transparent; color: #fff; border: 1px solid rgba(33, 150, 243, 0.6); border-radius: 4px; padding: 4px;">
                <option value="none">off</option>
                <option value="boundary">boundary frequency</option>
                <option value="facility">facility stability</option>
                <option value="capacity">capacity</option>
            </select>
        </div>

        <!-- MODE INDICATOR - INSIDE CONTROL PANEL AT BOTTOM -->
        <div
            style="margin-top: 16px; padding: 10px; background: rgba(33, 150, 243, 0.1); border-radius: 4px; border-left: 3px solid #2196f3;">
            <div style="font-size: 10px; font-weight: 600; color: #90caf9; margin-bottom: 4px;">CURRENT MODE</div>
            <div style="font-size: 12px; font-weight: bold; color: #ffffff;">
                <span id="fp-currentViewMode">DETAILED</span>
            </div>
            <div style="font-size: 10px; color: #bbdefb; margin-top: 4px; word-break: break-word; white-space: pre-line;">
                <span id="fp-currentColoringMode"></span>
            </div>
        </div>
    </div>

    <aside id="sidebar">
        <h2>Animation Status</h2>

        <div style="margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid #eee;">
            <h3 style="font-size: 12px; font-weight: 600; color: #666; margin: 0 0 8px 0;">STEP METADATA</h3>
            <div id="treeMetadata"></div>
        </div>

        <div>
            <h3 style="font-size: 12px; font-weight: 600; color: #666; margin: 0 0 8px 0;">STATUS LOG</h3>
            <div id="statusPanel" style="font-size: 11px; line-height: 1.4; max-height: 200px; overflow-y: auto;">
            </div>
        </div>
    </aside>

    <canvas id="graphCanvas"></canvas>
    <!-- Bottom-center: the canvas legend owns bottom-left, controls bottom-right. -->
    <div id="sparkline"
        style="position: absolute; left: 50%; transform: translateX(-50%); bottom: 20px; width: 320px; height: 64px; z-index: 1000; background: rgba(0,0,0,0.72); border: 1px solid #2196f3; border-radius: 6px; padding: 6px 8px;">
    </div>
    <div id="tooltip"></div>

    <!-- Thin bootstrap around js/mountFalcomPlot.js — the same mount
         API the SvelteKit dashboard embeds. -->
</body>

</html>
